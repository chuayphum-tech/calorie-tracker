<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raw Material Issue</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:system-ui;
  background:url("bg-warehouse.jpg") center/cover no-repeat fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:-1;
}
.container{
  max-width:720px;
  margin:30px auto;
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}
h2{text-align:center;margin-bottom:16px;}
label{font-weight:600;font-size:13px;margin-top:10px;display:block;}
input,select{
  width:100%;
  height:40px;
  border:1px solid #ccc;
  border-radius:8px;
  padding:6px 10px;
  font-size:14px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
button{
  margin-top:12px;
  height:42px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  transition:.2s;
}
button:hover{opacity:.9;transform:translateY(-1px);}
.add{background:#1976d2;color:#fff;}
.confirm{background:#2e7d32;color:#fff;width:100%;}
.delete{background:#e53935;color:#fff;padding:4px 8px;border-radius:6px;}
.dashboard-btn{
  width:100%;
  margin-top:10px;
  background:linear-gradient(45deg,#1e3c72,#2a5298);
  color:#fff;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
}
th{background:#263238;color:#fff;padding:8px;text-align:left;}
td{padding:8px;border-bottom:1px solid #ddd;}
.qty{text-align:right;font-weight:600;}
.summary{
  margin-top:12px;
  padding:10px;
  background:#f1f8e9;
  border-radius:8px;
  font-weight:600;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:#fff;
  padding:20px;
  border-radius:14px;
  width:95%;
  max-width:760px;
}
.review-header{
  display:flex;
  justify-content:space-between;
  border-bottom:2px solid #eee;
  padding-bottom:10px;
  margin-bottom:14px;
}
.small{font-size:12px;color:#666;}

/* ===== TOAST ===== */
.toast{
  position:fixed;
  top:20px;
  right:20px;
  background:#2e7d32;
  color:#fff;
  padding:14px 20px;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,.3);
  font-weight:600;
  opacity:0;
  transform:translateY(-20px);
  transition:all .4s ease;
  z-index:9999;
}
.toast.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>

<div class="container">
<h2>📦 ระบบใบเบิกวัตถุดิบ</h2>

<div class="grid">
<div>
<label>เครื่องจักร</label>
<select id="machine">
<option value="">-- เลือก --</option>
<option>Machine-01</option>
<option>Machine-02</option>
</select>
</div>

<div>
<label>วันที่</label>
<input type="date" id="issueDate">
</div>
</div>

<label>เลือกวัตถุดิบ</label>
<select id="item">
<option>กำลังโหลดข้อมูล...</option>
</select>

<label>จำนวน</label>
<input type="number" id="qty" min="1">

<button class="add" onclick="addItem()">➕ เพิ่มรายการ</button>

<table>
<thead>
<tr>
<th>#</th>
<th>Code</th>
<th>รายการ</th>
<th>Qty</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<div class="summary" id="liveSummary"></div>

<button class="confirm" onclick="openReview()">ตรวจสอบก่อนบันทึก</button>

<button class="dashboard-btn" onclick="openDashboard()">
📊 Summary Dashboard
</button>

</div>

<div class="modal" id="modal">
<div class="modal-box">
<div class="review-header">
<div>
<b>📋 สรุปใบเบิก</b><br>
<span id="revMachine"></span><br>
<span id="revDate"></span>
</div>
<div>
เลขที่: <b id="revID"></b><br>
<span class="small" id="revTime"></span>
</div>
</div>
<div id="reviewTable"></div>
<div class="summary" id="revSummary"></div>
<button class="confirm" onclick="submit()">ยืนยัน</button>
<button onclick="closeModal()">กลับ</button>
</div>
</div>

<div id="toast" class="toast"></div>

<script>

const DASHBOARD_URL="https://script.google.com/macros/s/AKfycbxPmFk6DcQFxR8C_-2hwPGjJsELmjCyv-pCnYPz_3nfqbfduSts2iPg-urjZobu3poJlQ/exec?page=dashboard";

function openDashboard(){
  window.open(DASHBOARD_URL,"_blank");
}

/* ===== TOAST FUNCTION ===== */
function showToast(message){
  const toast=document.getElementById("toast");
  toast.innerText=message;
  toast.classList.add("show");
  setTimeout(()=>{
    toast.classList.remove("show");
  },3000);
}

const SHEET_ID="1jVYjQcsO1SLd6PoocZpA-YXyJdXZk0Rt8nNrc33vtns";
const GID="1313375061";
const FORM_URL="https://docs.google.com/forms/d/e/1FAIpQLSc6KrMRfJqgoV3eYqG0IhMA01B6cyXa-s-GDFNC1MQ9JhmApw/formResponse";

let items=[];

async function loadItems(){
const query = encodeURIComponent("SELECT B,C,D WHERE E='Active'");
const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&tq=${query}&gid=${GID}`;
try{
const res = await fetch(url);
const text = await res.text();
const json = JSON.parse(text.substring(47).slice(0,-2));
const rows = json.table.rows;
item.innerHTML='<option value="">-- เลือก --</option>';
rows.forEach(r=>{
const code=r.c[0]?.v;
const name=r.c[1]?.v;
const unit=r.c[2]?.v;
item.innerHTML+=`<option value="${name}" data-code="${code}" data-unit="${unit}">${code} - ${name}</option>`;
});
}catch(e){
item.innerHTML='<option value="">โหลดข้อมูลล้มเหลว</option>';
}
}
loadItems();

function addItem(){
const sel=item;
const quantity=parseInt(qty.value);
if(!sel.value||!quantity)return showToast("กรอกข้อมูลไม่ครบ");
const code=sel.selectedOptions[0].dataset.code;
const unit=sel.selectedOptions[0].dataset.unit;
const exist=items.find(i=>i.code===code);
if(exist){exist.qty+=quantity;}
else{items.push({code,name:sel.value,unit,qty:quantity});}
render();
qty.value="";
}

function render(){
list.innerHTML="";
let total=0;
items.forEach((i,idx)=>{
total+=i.qty;
list.innerHTML+=`<tr>
<td>${idx+1}</td>
<td>${i.code}</td>
<td>${i.name}</td>
<td class="qty">${i.qty} ${i.unit}</td>
<td><button class="delete" onclick="remove(${idx})">ลบ</button></td>
</tr>`;
});
liveSummary.innerHTML=`รวม ${items.length} รายการ | จำนวนรวม ${total}`;
}

function remove(i){items.splice(i,1);render();}

function openReview(){
if(items.length===0)return showToast("ไม่มีรายการ");
if(!machine.value)return showToast("เลือกเครื่องจักร");
if(!issueDate.value)return showToast("เลือกวันที่");

const id="ISS-"+Date.now();
revID.innerText=id;
revMachine.innerText="เครื่องจักร: "+machine.value;
revDate.innerText="วันที่: "+issueDate.value;
revTime.innerText="บันทึกเมื่อ: "+new Date().toLocaleString();

let total=0;
let html="<table><tr><th>#</th><th>Code</th><th>รายการ</th><th>Qty</th></tr>";
items.forEach((i,idx)=>{
total+=i.qty;
html+=`<tr>
<td>${idx+1}</td>
<td>${i.code}</td>
<td>${i.name}</td>
<td class="qty">${i.qty} ${i.unit}</td>
</tr>`;
});
html+="</table>";
reviewTable.innerHTML=html;
revSummary.innerHTML=`รวม ${items.length} รายการ | จำนวนรวม ${total}`;
modal.style.display="flex";
}

function closeModal(){modal.style.display="none";}

function submit(){
const id=revID.innerText;
const fd=new FormData();
fd.append("entry.433160390",id);
fd.append("entry.2142953662",machine.value);
fd.append("entry.1674395658",issueDate.value);
fd.append("entry.1740216135",JSON.stringify(items));
fetch(FORM_URL,{method:"POST",mode:"no-cors",body:fd});
showToast("บันทึกเรียบร้อย เลขที่: "+id);
setTimeout(()=>location.reload(),1500);
}

document.addEventListener("DOMContentLoaded", function () {
  const today = new Date().toISOString().split("T")[0];
  const dateInput = document.getElementById("issueDate");
  if(dateInput){
    dateInput.value = today;
  }
});
</script>

</body>
</html>
